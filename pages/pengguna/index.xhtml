<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pengguna - SIGAP Demo</title>
    <link rel="stylesheet" type="text/css" href="../../css/base.css" />
    <link rel="stylesheet" type="text/css" href="../../css/shell.css" />
    <link rel="stylesheet" type="text/css" href="../../css/components.css" />
    <link rel="stylesheet" type="text/css" href="../../css/demo.css" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="stylesheet" type="text/css" href="../../css/responsive.css" media="screen and (max-width: 900px)" />
    <link rel="stylesheet" type="text/css" href="../../css/mobile.css" media="screen and (max-width: 560px)" />
</head>
<body class="aplikasi" data-page="pengguna" data-akar="../../">

<div id="bingkai">
    <div id="sisi"></div>
    <div id="atas"></div>

    <div id="lembar">
        <div id="kanvas">
            <div id="pesan-flash"></div>

            <div class="kepala">
                <div class="judul">
                    <h1>Pengguna</h1>
                    <p class="keterangan">Akun yang dapat masuk ke SIGAP beserta peran dan statusnya.</p>
                </div>
            </div>

            <div class="strip tiga" id="strip-pengguna"></div>

            <div class="panel">
                <div class="panel-kepala">
                    <h2>Akun terdaftar</h2>
                    <span class="tautan" id="hitung-pengguna">Memuat data</span>
                </div>
                <div class="gulir-tabel">
                    <table class="tabel" id="tabel-pengguna"></table>
                </div>
            </div>

            <p class="teks-kecil teks-redup">Menurunkan peran admin atau menonaktifkan akun
                dapat memutus akses ke antrian tiket. Pastikan ada admin lain yang aktif.</p>

            <div class="kaki-lembar">
                <span class="kiri">SIGAP Demo &#183; Biro Sarana dan Prasarana</span>
                <span class="kanan">Data contoh di peramban</span>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="../../js/data.js"></script>
<script type="text/javascript" src="../../js/core.js"></script>
<script type="text/javascript" src="script.js"></script>
</body>
</html>
